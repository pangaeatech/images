name: Test Scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build rmsync
        run: docker buildx build --load -t rmsync:latest --file "rmsync.dockerfile" .

      - name: Run test
        run: docker run --rm -v ${{ github.workspace }}/scripts:/scripts:ro -w /scripts --entrypoint ./tests/run_tests.sh rmsync:latest
