name: Build Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v7

      - name: Find Dockerfiles
        id: find
        run: |
          dockerfiles=$(find . -maxdepth 1 -name "*.dockerfile" -printf "%f\n" | sed -e 's/\.dockerfile$//' | sort | jq -R . | jq -sc .)
          echo "Found Dockerfiles: $dockerfiles"
          if [ "$dockerfiles" = "[]" ]; then
            echo "No Dockerfiles found."
            exit 1
          fi
          echo "dockerfiles=$dockerfiles" >> $GITHUB_OUTPUT

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.discover.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.dockerfile }}
        if: github.ref_type != 'tag'
        run: |
          echo "Building image ${{ matrix.dockerfile }}"

          docker buildx build --file "${{ matrix.dockerfile }}.dockerfile" .

      - name: Build and Push ${{ matrix.dockerfile }}
        if: github.ref_type == 'tag'
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          echo "Building and pushing image ${{ matrix.dockerfile }} for tag $tag"

          docker buildx build --file "${{ matrix.dockerfile }}.dockerfile" --push --tag "ghcr.io/${{ github.repository }}/${{ matrix.dockerfile }}:${tag}" .
